<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tela.js Raymarch Shader</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<script type="module">
// SPDX-License-Identifier: CC-BY-NC-SA-4.0
// Copyright (c) 2026 @Frostbyte
// [LICENSE] https://creativecommons.org/licenses/by-nc-sa/4.0/
// AI port from https://fragcoord.xyz/s/mi99r927
import {
    Canvas,
    Color
} from "https://cdn.jsdelivr.net/npm/tela.js/src/index.js";


// ============================================================
// SETTINGS
// ============================================================

const WIDTH  = 320;
const HEIGHT = 180;
const AA     = 2;


// ============================================================
// CANVAS
// ============================================================

const canvas = Canvas.ofSize(WIDTH, HEIGHT);

document.body.appendChild(canvas.DOM);


// ============================================================
// ROTATION
// ============================================================

function rotate(v, t) {

    const s = Math.sin(t);
    const c = Math.cos(t);

    return {
        x: c * v.x - s * v.y,
        y: s * v.x + c * v.y
    };
}


// ============================================================
// NORMALIZE
// ============================================================

function normalize3(v) {

    const len = Math.sqrt(
        v.x * v.x +
        v.y * v.y +
        v.z * v.z
    );

    if (len === 0) {
        return {
            x: 0,
            y: 0,
            z: 0
        };
    }

    return {
        x: v.x / len,
        y: v.y / len,
        z: v.z / len
    };
}


// ============================================================
// XOR DOT NOISE
// ============================================================
//
// Original:
//
// const float PHI = 1.618033988;
//
// const mat3 GOLD = mat3(
//     -0.571464913, +0.814921382, +0.096597072,
//     -0.278044873, -0.303026659, +0.911518454,
//     +0.772087367, +0.494042493, +0.399753815
// );
//
// return dot(
//     cos(GOLD * p),
//     sin(PHI * p * GOLD)
// );
//
// IMPORTANT:
// GLSL matrix constructors are column-major.
//
// Also:
//
//     GOLD * p
//
// is NOT the same as:
//
//     p * GOLD
//
// ============================================================

function noise(p) {

    const PHI = 1.618033988;

    // GLSL mat3 constructor:
    //
    // column 0 = (-0.571...,  0.814...,  0.096...)
    // column 1 = (-0.278..., -0.303...,  0.911...)
    // column 2 = ( 0.772...,  0.494...,  0.399...)

    const a = -0.571464913;
    const b =  0.814921382;
    const c =  0.096597072;

    const d = -0.278044873;
    const e = -0.303026659;
    const f =  0.911518454;

    const g =  0.772087367;
    const h =  0.494042493;
    const i =  0.399753815;


    // --------------------------------------------------------
    // GOLD * p
    //
    // Matrix:
    //
    // [ a d g ]
    // [ b e h ]
    // [ c f i ]
    //
    // --------------------------------------------------------

    const mp = {
        x: a * p.x + d * p.y + g * p.z,
        y: b * p.x + e * p.y + h * p.z,
        z: c * p.x + f * p.y + i * p.z
    };


    // --------------------------------------------------------
    // p * GOLD
    //
    // Row-vector multiplication.
    //
    // --------------------------------------------------------

    const pm = {
        x: p.x * a + p.y * b + p.z * c,
        y: p.x * d + p.y * e + p.z * f,
        z: p.x * g + p.y * h + p.z * i
    };


    // --------------------------------------------------------
    // dot(
    //     cos(GOLD * p),
    //     sin(PHI * p * GOLD)
    // )
    // --------------------------------------------------------

    return (
        Math.cos(mp.x) * Math.sin(PHI * pm.x) +
        Math.cos(mp.y) * Math.sin(PHI * pm.y) +
        Math.cos(mp.z) * Math.sin(PHI * pm.z)
    );
}


// ============================================================
// ACES TONEMAP
// ============================================================

function aces(c) {

    const m1 = [
         0.59719,  0.07600,  0.02840,
         0.35458,  0.90834,  0.13383,
         0.04823,  0.01566,  0.83777
    ];

    const m2 = [
         1.60475, -0.10208, -0.00327,
        -0.53108,  1.10813, -0.07276,
        -0.07367, -0.00605,  1.07602
    ];


    // GLSL:
    //
    // vec3 v = m1 * c;
    //
    // GLSL matrices are column-major.

    const v = {
        x:
            m1[0] * c.x +
            m1[3] * c.y +
            m1[6] * c.z,

        y:
            m1[1] * c.x +
            m1[4] * c.y +
            m1[7] * c.z,

        z:
            m1[2] * c.x +
            m1[5] * c.y +
            m1[8] * c.z
    };


    const aa = {
        x: v.x * (v.x + 0.0245786) - 0.000090537,
        y: v.y * (v.y + 0.0245786) - 0.000090537,
        z: v.z * (v.z + 0.0245786) - 0.000090537
    };


    const bb = {
        x: v.x * (0.983729 * v.x + 0.4329510) + 0.238081,
        y: v.y * (0.983729 * v.y + 0.4329510) + 0.238081,
        z: v.z * (0.983729 * v.z + 0.4329510) + 0.238081
    };


    const q = {
        x: aa.x / bb.x,
        y: aa.y / bb.y,
        z: aa.z / bb.z
    };


    // vec3 result = m2 * q

    return {
        x:
            m2[0] * q.x +
            m2[3] * q.y +
            m2[6] * q.z,

        y:
            m2[1] * q.x +
            m2[4] * q.y +
            m2[7] * q.z,

        z:
            m2[2] * q.x +
            m2[5] * q.y +
            m2[8] * q.z
    };
}


// ============================================================
// CLAMP
// ============================================================

function clamp01(x) {

    if (!Number.isFinite(x)) {
        return 0;
    }

    return Math.max(
        0,
        Math.min(1, x)
    );
}


// ============================================================
// PIXEL SHADER
// ============================================================

function renderPixel(x, y, vars) {

    const AA     = vars.AA;
    const width  = vars.width;
    const height = vars.height;
    const time   = vars.time;


    let color = {
        x: 0,
        y: 0,
        z: 0
    };


    // ========================================================
    // 2x2 AA
    // ========================================================

    for (let m = 0; m < AA; m++) {

        for (let n = 0; n < AA; n++) {

            const offX =
                (m + 0.5) / AA - 0.5;

            const offY =
                (n + 0.5) / AA - 0.5;


            const u = {
                x: x + offX,
                y: y + offY
            };


            // =================================================
            // Initial position
            // =================================================

            let p = {
                x: 0,
                y: 0,
                z: -1.0 - 0.5 * Math.sin(time * 0.1)
            };


            // =================================================
            // Camera ray
            // =================================================

            const d = normalize3({
                x: 2.0 * u.x - width,
                y: 2.0 * u.y - height,
                z: height
            });


            // =================================================
            // Light
            // =================================================

            let light = {
                x: 0,
                y: 0,
                z: 0
            };


            // =================================================
            // Ray march
            // =================================================

            for (let iter = 0; iter < 10; iter++) {

                const b = {
                    x: p.x,
                    y: p.y,
                    z: p.z
                };


                // ------------------------------------------------
                // b.xy = r(sin(b.xy*.25),
                //           t*.5+b.z*2.)
                // ------------------------------------------------

                const rb = rotate(
                    {
                        x: Math.sin(b.x * 0.25),
                        y: Math.sin(b.y * 0.25)
                    },
                    time * 0.5 + b.z * 2.0
                );


                b.x = rb.x;
                b.y = rb.y;


                // ------------------------------------------------
                // Noise
                // ------------------------------------------------

                const n1 = noise({
                    x: b.x * 20.0,
                    y: b.y * 20.0,
                    z: b.z * 20.0
                });

                const n2 = noise(b);


                let s =
                    0.001 +
                    Math.abs(
                        n1 / 20.0 - n2
                    ) * 0.7;


                // ------------------------------------------------
                // Additional density
                // ------------------------------------------------

                s +=
                    Math.abs(
                        p.y * 0.2 +
                        Math.sin(
                            p.z * 2.0 +
                            Math.abs(p.x) * 0.5
                        )
                    ) * 0.5;


                // ------------------------------------------------
                // Advance
                // ------------------------------------------------

                p.x += d.x * s;
                p.y += d.y * s;
                p.z += d.z * s;


                // ------------------------------------------------
                // Lighting
                //
                // GLSL:
                //
                // l += (1.+
                //       1.5*sin(
                //           i+
                //           length(p.xy*.1)+
                //           2.+
                //           vec3(3,1.5,.5)
                //       )) / s;
                // ------------------------------------------------

                const radial =
                    Math.sqrt(
                        p.x * p.x +
                        p.y * p.y
                    ) * 0.1;


                light.x +=
                    (
                        1.0 +
                        1.5 * Math.sin(
                            iter +
                            radial +
                            2.0 +
                            3.0
                        )
                    ) / s;


                light.y +=
                    (
                        1.0 +
                        1.5 * Math.sin(
                            iter +
                            radial +
                            2.0 +
                            1.5
                        )
                    ) / s;


                light.z +=
                    (
                        1.0 +
                        1.5 * Math.sin(
                            iter +
                            radial +
                            2.0 +
                            0.5
                        )
                    ) / s;
            }


            // =================================================
            // ACES
            // =================================================

            const mapped = aces({
                x: light.x * light.x / 500.0,
                y: light.y * light.y / 500.0,
                z: light.z * light.z / 500.0
            });


            color.x += mapped.x;
            color.y += mapped.y;
            color.z += mapped.z;
        }
    }


    // ========================================================
    // AA average
    // ========================================================

    const samples = AA * AA;

    color.x /= samples;
    color.y /= samples;
    color.z /= samples;


    // ========================================================
    // Tela Color
    // ========================================================

    return Color.ofRGB(
        clamp01(color.x),
        clamp01(color.y),
        clamp01(color.z),
        1
    );
}


// ============================================================
// PARALLEL RENDERER
// ============================================================

const parallel = canvas.mapParallel(
    renderPixel,
    [
        rotate,
        normalize3,
        noise,
        aces,
        clamp01
    ]
);


// ============================================================
// DEBUG FIRST FRAME
// ============================================================
//
// This verifies that the Tela canvas itself is visible.
// It should briefly show a gradient before the shader frame.
// ============================================================

canvas.map((x, y) => {

    const r = x / WIDTH;
    const g = y / HEIGHT;

    return Color.ofRGB(
        r,
        g,
        0.15,
        1
    );

});

canvas.paint();


// ============================================================
// RENDER
// ============================================================

let rendering = false;

let startTime = performance.now();

async function render() {

    if (rendering) {
        requestAnimationFrame(render);
        return;
    }

    rendering = true;

    try {

        const time =
            (performance.now() - startTime) / 1000;


        await parallel.run({

            AA: AA,

            width: canvas.width,

            height: canvas.height,

            time: time

        });


        canvas.paint();

    } catch (error) {

        console.error(
            "Tela shader render failed:",
            error
        );

    } finally {

        rendering = false;

        requestAnimationFrame(render);
    }
}

render();

</script>

</body>
</html>
